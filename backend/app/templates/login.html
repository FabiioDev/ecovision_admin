{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block bare %}
<main class="login-page">
  <div class="card login-card">
    <span class="brand">{{ icon('recycling') }}EcoVision SV</span>
    <div class="label-md muted">Panel de administración</div>
    <h1 class="title-lg">Hola de nuevo</h1>
    <p class="muted">Inicia sesión con tu cuenta de administrador.</p>

    {% if error %}
    <div class="alert alert-error" role="alert">{{ icon('error') }}<span>{{ error }}</span></div>
    {% endif %}

    <form method="post" action="/admin/login" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label class="form-field"><span>Usuario</span>
        <input name="username" value="{{ username or '' }}" required autofocus autocomplete="username" maxlength="40"
               class="{{ 'input-error' if error }}">
      </label>
      <label class="form-field"><span>Contraseña</span>
        <input type="password" name="password" required autocomplete="current-password" class="{{ 'input-error' if error }}">
      </label>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
  </div>
</main>
{% endblock %}
